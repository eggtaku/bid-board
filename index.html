 const more=[['공고번호',it.no],['공고구분',it.ntce],['게시일시',it.posted],['개찰일시',it.open],['연결공고',it.link],['평가주체 근거',it.evalWhy],['모집 확인출처',it.recSrc],[it.tab==='사전규격'||it.tab==='발주계획'?'매칭조건':'자격 매칭 사유',it.match],['담당자',it.contact]].filter(x=>x[1]);
 if(more.length)det+='<details><summary>상세 정보</summary><div>'+more.map(x=>'<b>'+x[0]+'</b>: '+esc(x[1])).join('\n')+'</div></details>';
 const acts=it.url?'<div class="acts"><a href="'+esc(it.url)+'" target="_blank" rel="noopener">'+esc(it.urlLbl||'공고 원문 열기')+' ↗</a></div>':'';
 return '<div class="card'+(it.re?' re':'')+(d&&d.past?' past':'')+'" data-no="'+esc(it.no)+'"><div class="top">'+top+'</div><div class="name">'+esc(it.name)+'</div><dl class="kv">'+kv.join('')+'</dl>'+det+acts+'</div>';}
function render(){const q=st.q.trim().toLowerCase();let L=DATA.filter(it=>inTab(it,st.tab));
 if(q)L=L.filter(it=>[it.name,it.org,it.no,it.src,it.kind,it.qual].join(' ').toLowerCase().includes(q));
 if(st.f.re)L=L.filter(it=>it.re);if(st.f.rec)L=L.filter(isRec);if(st.f.hot)L=L.filter(isHot);if(st.f.pps)L=L.filter(isPps);
 const far=8.64e15;const key=it=>{if(it.tab==='발주계획')return pd((it.plan||'')+'-01')||far;const d=pd(it.dl);if(!d)return far-1;return d<NOW?far+(-d):+d;};
 if(st.sort==='amt')L.sort((a,b)=>(b.amt||0)-(a.amt||0));else if(st.sort==='new')L.sort((a,b)=>(pd(b.posted)||0)-(pd(a.posted)||0));else L.sort((a,b)=>key(a)-key(b));
 $('#cnt').textContent=L.length+'건'+(L.length!==DATA.filter(it=>inTab(it,st.tab)).length?' (필터 적용)':'')+(st.tab==='새 공고'?' · 최근 4일 게시 용역':'');
 $('#list').innerHTML=L.length?L.map(card).join(''):'<div class="empty">'+(st.tab==='새 공고'&&!DATA.some(isRecent4)?'최근 4일 동안 새로 올라온 용역 공고가 없어요':'해당하는 공고가 없어요')+'</div>';
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===st.tab));}
function init(){$('#upd').textContent='업데이트: '+META.updated+' (KST) · 마지막 실행 '+META.run;
 const c=t=>DATA.filter(it=>inTab(it,t)).length;
 $('#sum').innerHTML=TABS.map(([t,l])=>'<div>'+(t==='새 공고'?'최근 4일 용역':l)+'<b>'+c(t)+'</b></div>').join('')+'<div>재공고<b>'+DATA.filter(it=>it.re).length+'</b></div><div>모집중<b>'+DATA.filter(isRec).length+'</b></div><div>조달청 평가<b>'+DATA.filter(isPps).length+'</b></div>';
 $('#tabs').innerHTML=TABS.map(([t,l])=>'<button data-t="'+t+'">'+l+'<span class="n">'+c(t)+'</span></button>').join('');
 $('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){st.tab=b.dataset.t;render();window.scrollTo(0,0);}};
 $('#q').oninput=e=>{st.q=e.target.value;render();};
 document.querySelectorAll('.tg').forEach(b=>b.onclick=()=>{st.f[b.dataset.f]=!st.f[b.dataset.f];b.classList.toggle('on',st.f[b.dataset.f]);render();});
 $('#sort').onchange=e=>{st.sort=e.target.value;render();};
 $('#foot').innerHTML='출처: 조달청 나라장터·누리장터·한국수자원공사·한국마사회 공공데이터(data.go.kr). 마감·취소 공고와 수의계약은 제외됨.<br>D-day·마감 표시는 이 기기의 현재 시각 기준, 새 공고 탭은 이 기기 시각 기준 최근 4일(96시간) 안에 게시된 용역 공고. NEW 배지는 이전 실행에서 처음 확인된 공고(첫 확인: '+esc(META.run)+').';
 const h=new URLSearchParams(location.hash.slice(1));if(h.get('tab'))st.tab=h.get('tab');['re','rec','hot','pps'].forEach(f=>{if(h.get(f)){st.f[f]=true;document.querySelector('.tg[data-f='+f+']').classList.add('on');}});
 render();}
init();
</script></body></html>
